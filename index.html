<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINDO | بازی‌ساز هوش مصنوعی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
@font-face {
  font-family: "Vazir";
  src: local("Vazir"), url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2") format("woff2");
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif; }
button, select, textarea, input { font-family: inherit; }
body { background: #141414; color: #eee; min-height: 100vh; }

header { display: flex; justify-content: space-between; align-items: center; padding: 14px 5%; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; gap: 8px; }
.logo { font-size: 1.25rem; font-weight: bold; color: #ff7a18; }
.hbtn { background: none; border: 1px solid #555; color: #aaa; padding: 6px 14px; border-radius: 10px; cursor: pointer; font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif; }
.hbtn:hover { border-color: #e05050; color: #e05050; }

main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 5%; height: calc(100vh - 70px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #playArea { height: 70vh; } }

#chat { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
#chatHead { background: #ff7a18; color: #fff; padding: 12px 16px; font-weight: bold; }
#msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
.msg-b { max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: .92rem; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.user { align-self: flex-start; background: #333; }
.bot { align-self: flex-end; background: #2a1a0c; border: 1px solid #ff7a1855; }
.err { align-self: flex-end; background: #3a1010; border: 1px solid #e05050; color: #ffb0b0; direction: ltr; text-align: left; }
#inputArea { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid #333; }
#idea { width: 100%; background: #141414; color: #eee; border: 1px solid #333; border-radius: 12px; padding: 12px; min-height: 90px; resize: vertical; font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif; }
#idea:focus { outline: none; border-color: #ff7a18; }
#build { background: #ff7a18; color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 1.05rem; cursor: pointer; }
#build:hover { background: #ff9445; }
#build:disabled { background: #555; cursor: wait; }

#playArea { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
#playHead { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2e2e2e; color: #aaa; }
#dlBtn { background: none; border: 1px solid #ff7a18; color: #ff7a18; padding: 6px 16px; border-radius: 10px; cursor: pointer; font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif; }
#dlBtn:hover { background: #ff7a18; color: #fff; }
#frameWrap { flex: 1; position: relative; }
#gameFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #141414; }
#placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; gap: 12px; }
#placeholder .big { font-size: 3rem; }

#attachRow { display: flex; gap: 8px; align-items: center; }
#attachBtn { background: #141414; color: #ff7a18; border: 1px solid #ff7a18; padding: 8px 14px; border-radius: 12px; cursor: pointer; }
#attachBtn:hover { background: #ff7a18; color: #fff; }
#previews { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid #444; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; line-height: 18px; text-align: center; background: #000b; color: #fff; border-radius: 50%; cursor: pointer; font-size: 13px; }
.msg-b .imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.msg-b .imgs img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">🎮 بازی‌ساز BINDO</div>
  <span><button class="hbtn" onclick="clearKey();alert('کلید پاک شد')">🔑 پاک کردن کلید</button> <button class="hbtn" onclick="resetChat()">🗑 پاک کردن گفتگو</button></span>
</header>

<main>
  <section id="chat">
    <div id="chatHead">🛠️ توصیف بازی‌ات رو بنویس 🧠
      <select id="modelSel" style="margin-top:8px;width:100%;padding:6px;border-radius:8px;border:none;font-family:inherit;font-size:.9rem">
        <option value="@cf/qwen/qwen2.5-coder-32b-instruct">Qwen 2.5 Coder 32B (رایگان، بدون کلید)</option>
        <option value="glm-4.7-flash">GLM 4.7 Flash (رایگان، متن)</option>
        <option value="glm-4.5-flash">GLM 4.5 Flash (رایگان، متن)</option>
        <option value="glm-4.6v-flash">GLM 4.6V Flash (رایگان، تصویر)</option>
      </select>
    </div>
    <div id="msgs">
      <div class="msg-b bot">سلام BINDO! 😎 بازی‌ای که می‌خوای رو توصیف کن. مثلاً:
«یه بازی مار به سبک نوکیا با دکمه‌های لمسی»
بعد از ساخت هم می‌تونی بگی «همونو سخت‌تر کن» — چون کل گفتگو رو یادشه! 🧠🚀</div>
    </div>
    <div id="inputArea">
      <div id="previews"></div>
      <textarea id="idea" placeholder="مثلاً: یه بازی مار (Snake) که غذاهاش ستاره باشن..."></textarea>
      <div id="attachRow">
        <button id="attachBtn" type="button" onclick="document.getElementById('imgInput').click()">🖼️ افزودن تصویر</button>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="onPickImages(this)">
      </div>
      <button id="build" type="button" onclick="buildGame()">🤖 بسازش BINDO!</button>
    </div>
  </section>

  <section id="playArea">
    <div id="playHead">
      <span id="status">هنوز بازی‌ای ساخته نشده</span>
      <button id="dlBtn" onclick="downloadGame()" style="display:none">⬇ دانلود بازی</button>
    </div>
    <div id="frameWrap">
      <div id="placeholder"><div class="big">🕹️</div><div>بازی ساخته‌شده این‌جا نمایش داده می‌شه</div></div>
      <iframe id="gameFrame" sandbox="allow-scripts"></iframe>
    </div>
  </section>
</main>

<script>
window.onerror = function(msg, src, line) {
  try { addMsg("خطای جاوااسکریپت:\n" + msg + " (خط " + line + ")", "err"); } catch(e) {}
};

/* ===== تنظیمات هوش مصنوعی ===== */
var API_URL = "https://worker.mohammad1392reza2931.workers.dev";
var CF_URL = "https://white-voice-72bd.mohammad1392reza2931.workers.dev";
function isCF(model) { return String(model || "").indexOf("@cf/") === 0; }
/* 🔑 کلید جدیدت رو بین دو تا کوتیشن بذار (مثلاً "sk-..."). اگه خالی بمونه، صفحه ازت می‌پرسه. */
var API_KEY = "";
var memKey = "";
function getKey() {
  if (API_KEY) return API_KEY;
  var k = "";
  try { k = localStorage.getItem("gap_key") || ""; } catch (e) {}
  if (!k) k = memKey;
  if (!k) {
    k = (prompt("کلید API‌ای که از z.ai گرفتید را وارد کنید:") || "").trim();
    if (k) { memKey = k; try { localStorage.setItem("gap_key", k); } catch (e) {} }
  }
  return k;
}
function clearKey() {
  memKey = "";
  try { localStorage.removeItem("gap_key"); } catch (e) {}
}
function getModel() { return document.getElementById("modelSel").value; }
function getModelName(id) {
  var opts = document.getElementById("modelSel").options;
  for (var i = 0; i < opts.length; i++) {
    if (opts[i].value === id) return opts[i].text.replace(/\s*[\(（].*$/, "").trim();
  }
  return id;
}
/* ============================== */

var SYSTEM = [
  "تو یک سازنده بازی حرفه‌ای و متخصص برنامه‌نویسی هستی. کاربر بازی‌ای را توصیف می‌کند و تو باید یک بازی کامل، پولیش‌شده و قابل بازی بسازی.",
  "قوانین:",
  "- همیشه خروجی تو فقط یک فایل HTML کامل باشد که HTML، CSS و JavaScript همه داخل خودش باشد (خروجی نهایی همیشه نسخه کامل و قابل اجراست).",
  "- اگر کاربر روی بازی قبلی تغییری خواست، نسخه قبلی را از تاریخچه گفتگو بگیر، تغییرات را روی همان اعمال کن و کل نسخه جدید را کامل برگردان.",
  "- هیچ توضیح اضافه یا بلوک کد (سه بک‌تیک) ننویس؛ خروجی باید دقیقاً از <html شروع شود و با </html> تمام شود.",
  "- بازی باید فارسی، راست‌چین، با رنگ‌بندی تیره و لهجه نارنجی (#ff7a18) باشد.",
  "- فونت تمام متن‌های بازی باید وزیر باشد: داخل head این را بگذار <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap\"> و در CSS بنویس font-family: Vazirmatn, Tahoma, sans-serif (روی دکمه‌ها و canvas text هم همین فونت را اعمال کن).",
  "- بازی باید امتیاز داشته باشد، کنترل واضح (کیبورد + لمسی) داشته باشد، صدا/انیمیشن ساده داشته باشد و روی موبایل هم عالی کار کند.",
  "- کیفیت کد بالا: بدون باگ، بدون خطای کنسول، فیزیک و گیم‌پلی روان."
].join("\n");

/* ===== پیوست تصویر ===== */
var pendingImages = [];
function fileToDataURL(file) {
  return new Promise(function(resolve, reject) {
    var fr = new FileReader();
    fr.onerror = function() { reject(new Error("خواندن تصویر ناموفق بود")); };
    fr.onload = function() {
      var img = new Image();
      img.onerror = function() { reject(new Error("فرمت تصویر پشتیبانی نمی‌شود")); };
      img.onload = function() {
        var max = 1280, w = img.width, h = img.height;
        var r = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * r); c.height = Math.round(h * r);
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function onPickImages(input) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = "";
  files.slice(0, 4 - pendingImages.length).forEach(function(f) {
    fileToDataURL(f).then(function(url) { pendingImages.push(url); renderPreviews(); })
      .catch(function(e) { addMsg(String(e.message || e), "err"); });
  });
}
function renderPreviews() {
  var box = document.getElementById("previews");
  box.innerHTML = "";
  pendingImages.forEach(function(url, i) {
    var t = document.createElement("div"); t.className = "thumb";
    var im = document.createElement("img"); im.src = url;
    var x = document.createElement("span"); x.className = "x"; x.textContent = "×";
    x.onclick = function() { pendingImages.splice(i, 1); renderPreviews(); };
    t.appendChild(im); t.appendChild(x); box.appendChild(t);
  });
}
function addUserMsg(text, images) {
  var d = addMsg("", "user");
  if (images && images.length) {
    var w = document.createElement("div"); w.className = "imgs";
    images.forEach(function(u) { var im = document.createElement("img"); im.src = u; w.appendChild(im); });
    d.appendChild(w);
  }
  d.appendChild(document.createTextNode(text));
  return d;
}
function buildContent(text, images) {
  if (!images || !images.length) return text;
  var parts = [{ type: "text", text: text }];
  images.forEach(function(u) { parts.push({ type: "image_url", image_url: { url: u } }); });
  return parts;
}
/* ======================= */

var lastGameHTML = null;
var chatHistory = [];

function addMsg(text, cls) {
  var box = document.getElementById("msgs");
  var d = document.createElement("div");
  d.className = "msg-b " + (cls || "bot");
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function resetChat() {
  chatHistory = [];
  var box = document.getElementById("msgs");
  box.innerHTML = "";
  addMsg("گفتگو پاک شد! 🧹 یه بازی جدید توصیف کن BINDO 😎", "bot");
}

function cleanHistory() {
  var clean = [];
  for (var i = 0; i < chatHistory.length; i++) {
    var h = chatHistory[i];
    var c = (h && typeof h.content === "string") ? h.content : "";
    if (h && (h.role === "user" || h.role === "assistant") && c.trim() !== "") {
      if (c.length > 12000) c = c.slice(0, 12000);
      clean.push({ role: h.role, content: c });
    }
  }
  return clean;
}

function callAPI(messages, model) {
  var cf = isCF(model || getModel());
  var key = cf ? "" : getKey();
  if (!cf && !key) return Promise.reject(new Error("کلید API وارد نشد."));
  var headers = { "Content-Type": "application/json" };
  if (!cf) headers["Authorization"] = "Bearer " + key;
  return fetch(cf ? CF_URL : API_URL, {
    method: "POST",
    headers: headers,
    body: JSON.stringify({ model: model || getModel(), messages: messages, max_tokens: 16000, stream: true })
  }).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(t) {
        if (cf) {
          var jj = null;
          try { jj = JSON.parse(t); } catch (e) {}
          if (jj && jj.error && jj.error.message) throw new Error("CFERR|" + (jj.error.code || "") + "|" + jj.error.message);
        }
        throw new Error("خطای سرور " + res.status + ":\n" + t.slice(0, 300));
      });
    }
    var ct = (res.headers.get("content-type") || "");
    if (ct.indexOf("text/event-stream") === -1 || !res.body || !res.body.getReader) return res.json();
    return readStream(res);
  });
}

/* خواندن جواب به‌صورت جریانی تا اتصال وسط راه قطع نشه (خطای 524) */
function readStream(res) {
  var reader = res.body.getReader();
  var dec = new TextDecoder("utf-8");
  var buf = "", content = "", finish = null;
  function handleLine(line) {
    line = line.trim();
    if (line.indexOf("data:") !== 0) return;
    var d = line.slice(5).trim();
    if (!d || d === "[DONE]") return;
    var j;
    try { j = JSON.parse(d); } catch (e) { return; }
    if (j.error) throw new Error("خطای سرور:\n" + JSON.stringify(j.error).slice(0, 300));
    var c = j.choices && j.choices[0];
    if (!c) return;
    if (c.delta && c.delta.content) content += c.delta.content;
    if (c.finish_reason) finish = c.finish_reason;
  }
  function pump() {
    return reader.read().then(function(r) {
      if (r.done) {
        if (buf) handleLine(buf);
        return { choices: [{ message: { content: content }, finish_reason: finish }] };
      }
      buf += dec.decode(r.value, { stream: true });
      var lines = buf.split("\n");
      buf = lines.pop();
      lines.forEach(handleLine);
      return pump();
    });
  }
  return pump();
}


/* ===== صف انتظار ===== */
var activeTicket = null;
function qFetch(path, opts) {
  return fetch(API_URL + path, opts).then(function(r) {
    if (!r.ok) throw new Error("no-queue");
    return r.json();
  }).then(function(j) {
    if (!j || j.queue !== true) throw new Error("no-queue");
    return j;
  });
}
function qPost(path, body, keepalive) {
  return qFetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: !!keepalive });
}
/* اگه سرور صف نداشته باشه null برمی‌گرده و ساخت مثل قبل مستقیم انجام می‌شه */
function joinQueue(model) {
  return qPost("/queue/join", { model: model }).then(function(j) {
    return { id: j.id, model: model, info: j };
  }).catch(function() { return null; });
}
function leaveQueue(t) {
  if (!t) return;
  if (activeTicket === t) activeTicket = null;
  qPost("/queue/done", { id: t.id, model: t.model }, true).catch(function() {});
}
function waitTurn(t, waitMsg, name) {
  return new Promise(function(resolve, reject) {
    var lastShown = -2;
    function show(info) {
      var n = info.ahead;
      if (info.ready) { waitMsg.textContent = "⏳ " + name + " داره بازی‌ات رو می‌سازه... ۱ تا ۲ دقیقه صبر کن 🤖"; return; }
      if (n === lastShown) return;
      lastShown = n;
      waitMsg.textContent = "🚦 " + name + " الان شلوغه. " + n + " نفر جلوی تو تو صفن (از مجموع " + info.total + " نفر در صف).\nصبر کن، نوبتت که بشه خودکار شروع می‌شه 🙏";
    }
    function tick(info) {
      show(info);
      if (info.ready) return resolve();
      setTimeout(poll, 2000);
    }
    function poll() {
      if (activeTicket !== t) return reject(new Error("صف لغو شد."));
      qFetch("/queue/status?model=" + encodeURIComponent(t.model) + "&id=" + encodeURIComponent(t.id))
        .then(tick)
        .catch(function(e) {
          if (e && e.message === "no-queue") return resolve();
          setTimeout(poll, 3000);
        });
    }
    activeTicket = t;
    tick(t.info);
  });
}
function queuedCall(messages, model, waitMsg, name) {
  if (isCF(model)) return callAPI(messages, model);
  return joinQueue(model).then(function(t) {
    if (!t) return callAPI(messages, model);
    return waitTurn(t, waitMsg, name)
      .then(function() { return callAPI(messages, model); })
      .then(function(d) { leaveQueue(t); return d; }, function(e) { leaveQueue(t); throw e; });
  });
}
window.addEventListener("pagehide", function() { if (activeTicket) leaveQueue(activeTicket); });
/* ============================== */

function handleResult(data, idea, nImgs) {
  if (nImgs) idea = idea + "\n[" + nImgs + " تصویر پیوست شده بود]";
  if (!data.choices || !data.choices[0] || !data.choices[0].message) {
    addMsg("جواب غیرمنتظره از سرور:\n" + JSON.stringify(data).slice(0, 300), "err");
    return;
  }
  var raw = (data.choices[0].message.content || "") + "";
  var code = raw;
  var m = code.match(/<!DOCTYPE[\s\S]*<\/html>|<html[\s\S]*<\/html>/i);
  if (m) code = m[0];

  if (code.toLowerCase().indexOf("<html") === -1) {
    if (raw.trim() !== "") addMsg("🤖 " + raw.slice(0, 500), "bot");
    chatHistory.push({ role: "user", content: idea });
    chatHistory.push({ role: "assistant", content: raw });
    return;
  }

  chatHistory.push({ role: "user", content: idea });
  chatHistory.push({ role: "assistant", content: code });

  lastGameHTML = code;
  document.getElementById("placeholder").style.display = "none";
  document.getElementById("gameFrame").srcdoc = code;
  document.getElementById("status").textContent = "🎮 بازی آماده‌ست! بازی کن!";
  document.getElementById("dlBtn").style.display = "inline-block";
  addMsg("بازیت آماده شد! 🎮 تغییری خواستی فقط بگو — بازی قبلی رو یادشه! 🧠", "bot");
}

function buildGame() {
  var ideaEl = document.getElementById("idea");
  var idea = ideaEl.value.trim();
  var imgs = pendingImages.slice();
  if (!idea && imgs.length) idea = "این تصویر(ها) رو ببین و بر اساسش بازی رو بساز/تغییر بده.";
  if (!idea) { addMsg("اول بازی‌ات رو توصیف کن BINDO! 😄", "bot"); return; }

  addUserMsg(idea, imgs);
  ideaEl.value = "";
  pendingImages = []; renderPreviews();

  var btn = document.getElementById("build");
  btn.disabled = true; btn.textContent = "⏳ در حال ساخت...";
  var useModel = imgs.length ? "glm-4.6v-flash" : getModel();
  var waitMsg = addMsg("⏳ " + getModelName(useModel) + " داره بازی‌ات رو می‌سازه... ۱ تا ۲ دقیقه صبر کن 🤖", "bot");

  var messages = [{ role: "system", content: SYSTEM }].concat(cleanHistory());
  messages.push({ role: "user", content: buildContent(idea, imgs) });

  queuedCall(messages, useModel, waitMsg, getModelName(useModel))
  .then(function(data) {
    waitMsg.remove();
    handleResult(data, idea, imgs.length);
  })
  .catch(function(err) {
    waitMsg.remove();
    var msg = String(err && err.message ? err.message : err);
    if (msg.indexOf("CFERR|") === 0) {
      var parts = msg.split("|");
      var code = parts[1], fa = parts.slice(2).join("|");
      if (code === "context") {
        addMsg("📏 " + fa, "bot");
        msg = "400"; /* می‌ره سراغ تلاش مجدد بدون حافظه */
      } else {
        addMsg("⚠️ " + fa, "bot");
        return;
      }
    }
    if (msg.indexOf("insufficient_quota") !== -1 || msg.indexOf("insufficient_user_quota") !== -1) {
      addMsg("💳 اعتبار حساب API تموم شده. حساب رو شارژ کن یا یه کلید دیگه بذار، یا از لیست بالا مدل ارزان‌تر (مثل GLM 4.7 Flash) انتخاب کن.", "bot");
      addMsg(msg, "err");
      return;
    }
    if (msg.indexOf("Failed to fetch") !== -1 || msg.indexOf("NetworkError") !== -1 || msg.indexOf("Load failed") !== -1) {
      addMsg("🌐 درخواست اصلاً به سرور نرسید. دلیلش یکی از اینهاست: اینترنت/فیلترینگ (VPN رو روشن یا خاموش کن)، دامنه سرویس برات بسته‌ست، یا سرور اجازه‌ی درخواست از داخل مرورگر (CORS) نمی‌ده.", "bot");
      return;
    }
    if (msg.indexOf("429") !== -1 || msg.indexOf("1305") !== -1 || msg.indexOf("overloaded") !== -1) {
      addMsg("⏳ سرویس هوش مصنوعی الان خیلی شلوغه و جواب نمی‌ده. مشکل از سایت ما نیست و کلیدت هم درسته. یکی دو دقیقه صبر کن و دوباره «بسازش BINDO!» رو بزن 🙏", "bot");
      return;
    }
    if (msg.indexOf("524") !== -1 || msg.indexOf("504") !== -1 || msg.indexOf("timeout") !== -1) {
      addMsg("⌛ سرور بیش از حد طول کشید و قطع شد (خطای 524). بازی‌های سنگین یا همراه با تصویر زمان بیشتری می‌برن. دوباره امتحان کن، یا توضیح بازی رو ساده‌تر کن.", "bot");
      return;
    }
    if (msg.indexOf("401") !== -1) { clearKey(); msg += "\n\n🔑 کلید نامعتبره؛ دفعه‌ی بعد دوباره ازت می‌پرسم."; }
    if (msg.indexOf("400") !== -1) {
      addMsg("⚠️ تلاش اول خطا داد، دوباره بدون حافظه امتحان می‌کنم...", "bot");
      callAPI([{ role: "system", content: SYSTEM }, { role: "user", content: buildContent(idea, imgs) }], useModel)
      .then(function(data) {
        handleResult(data, idea, imgs.length);
        addMsg("✅ جواب داد! حافظه ریست شد — دوباره بازی بساز تا یاد بگیره!", "bot");
      })
      .catch(function(err2) {
        addMsg(String(err2 && err2.message ? err2.message : err2), "err");
      });
    } else {
      addMsg(msg, "err");
    }
  })
  .finally(function() {
    btn.disabled = false; btn.textContent = "🤖 بسازش BINDO!";
  });
}

function downloadGame() {
  if (!lastGameHTML) return;
  var blob = new Blob([lastGameHTML], { type: "text/html" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bazim.html";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
